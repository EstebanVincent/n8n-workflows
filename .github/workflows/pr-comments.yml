name: Notify n8n - PR conversation comments

on:
  issue_comment:
    types: [created]

jobs:
  notify_pr_comment:
    if: ${{ github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    steps:
      - name: Send PR conversation comment to n8n webhook
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: |
          curl -X POST "$N8N_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "api-key: $N8N_API_KEY" \
            -d '{
              "event_name": "issue_comment",
              "action": "${{ github.event.action }}",
              "repository": "${{ github.repository }}",
              "sender": "${{ github.actor }}",
              "pr_number": "${{ github.event.issue.number }}",
              "title": ${{ toJson(github.event.issue.title) }},
              "url": ${{ toJson(github.event.issue.html_url) }},
              "author": ${{ toJson(github.event.comment.user.login) }},
              "comment_body": ${{ toJson(github.event.comment.body) }},
              "comment_url": ${{ toJson(github.event.comment.html_url) }},
              "created_at": ${{ toJson(github.event.comment.created_at) }}
            }'
