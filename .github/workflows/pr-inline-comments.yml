name: Notify n8n - PR inline review comments

on:
  pull_request_review_comment:
    types: [created]

jobs:
  notify_review_comment:
    runs-on: ubuntu-latest
    steps:
      - name: Send inline review comment to n8n webhook
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: |
          curl -X POST "$N8N_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "api-key: $N8N_API_KEY" \
            -d '{
              "event_name": "pull_request_review_comment",
              "action": "${{ github.event.action }}",
              "repository": "${{ github.repository }}",
              "sender": "${{ github.actor }}",
              "pr_number": "${{ github.event.pull_request.number }}",
              "title": ${{ toJson(github.event.pull_request.title) }},
              "url": ${{ toJson(github.event.comment.html_url) }},
              "author": ${{ toJson(github.event.comment.user.login) }},
              "comment_body": ${{ toJson(github.event.comment.body) }},
              "comment_url": ${{ toJson(github.event.comment.html_url) }},
              "created_at": ${{ toJson(github.event.comment.created_at) }}
            }'
