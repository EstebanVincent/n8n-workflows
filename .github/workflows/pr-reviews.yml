name: Notify n8n - PR reviews

on:
  pull_request_review:
    types: [submitted]

jobs:
  notify_review:
    runs-on: ubuntu-latest
    steps:
      - name: Send PR review to n8n webhook
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: |
          curl -X POST "$N8N_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "api-key: $N8N_API_KEY" \
            -d '{
              "event_name": "pull_request_review",
              "action": "${{ github.event.action }}",
              "repository": "${{ github.repository }}",
              "sender": "${{ github.actor }}",
              "pr_number": "${{ github.event.pull_request.number }}",
              "title": ${{ toJson(github.event.pull_request.title) }},
              "url": ${{ toJson(github.event.review.html_url) }},
              "author": ${{ toJson(github.event.review.user.login) }},
              "review_state": ${{ toJson(github.event.review.state) }},
              "comment_body": ${{ toJson(github.event.review.body) }},
              "created_at": ${{ toJson(github.event.review.submitted_at) }}
            }'
